name: Develop CI

on:
  push:
    branches:
      - develop

jobs:
  test-memory-2026:
    name: Test JPEG files
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify 'file' command
        run: |
          echo "Vérification que 'file' est installé"
          which file
          file --version || true

      - name: Test all JPEGs and replace corrupted ones
        run: |
          echo "Début de la vérification des fichiers JPEG..."
          for f in $(git ls-files '*.jpg'); do
            echo "Testing $f"
            FILE_TYPE=$(file "$f")
            echo "$FILE_TYPE"
            if [[ "$FILE_TYPE" != *"JPEG image data"* ]]; then
              echo "⚠️Fichier corrompu détecté : $f"
              echo "Remplacement par html/replacement.jpg"
              cp html/replacement.jpg "$f"
            fi
          done

      - name: Commit replaced JPEGs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add '*.jpg'
          git commit -m "Remplacement automatique des JPEG corrompus" || echo "Rien à commit"
          git push origin develop || echo "Push échoué"

  build-memory-2026:
    name: Build Docker image
    runs-on: self-hosted
    needs: test-memory-2026   

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          echo "Construction de l'image Docker..."
          docker build -t Antoine-3545/memory-2026 .

